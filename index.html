<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B1B3F">
<meta name="color-scheme" content="light">

<title>Rutas — Las Leñas</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

<style>
/* ── VARIABLES DE COLOR ── */
:root {
  --bg: #F4F6F9; 
  --surface: #FFFFFF;
  --text: #0B1B3F; 
  --text-muted: #5C6B8A;
  --header-bg: rgba(255, 255, 255, 0.85);
  --card-shadow: rgba(11, 27, 63, 0.06);
  --card-border: rgba(11, 27, 63, 0.03);
  --skeleton-1: #E2E8F0;
  --skeleton-2: #F1F5F9;
  
  --accent: #FF7900; 
  --accent-light: #FFF4EB;
  --snow: #0284C7; 
  --snow-bg: #F0F9FF;
  
  --green: #059669; --green-light: #ECFDF5;
  --orange: #D97706; --orange-light: #FFFBEB;
  --red: #DC2626; --red-light: #FEF2F2;
  
  --radius: 24px;
  --safe-t: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
html, body { height: 100%; background: var(--bg); color: var(--text); overflow: hidden; overscroll-behavior-y: none; }

.app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; position: relative; }

/* ── ENCABEZADO ── */
.header { 
  position: sticky; top: 0;
  background: var(--header-bg);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  padding: calc(var(--safe-t) + 20px) 24px 16px; 
  display: flex; justify-content: space-between; align-items: center; 
  border-bottom: 3px solid rgba(255, 121, 0, 0.9); 
  box-shadow: 0 4px 30px var(--card-shadow);
  z-index: 100;
}
.header-title { display: flex; flex-direction: column; justify-content: center; }

/* TÍTULO FUSIONADO CON LOGO */
.title-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.main-logo { height: 22px; width: 22px; object-fit: contain; }
.main-title { font-size: 15px; font-weight: 800; letter-spacing: 0.5px; color: var(--text); text-transform: uppercase; margin: 0; }

.header-subtitle { font-size: 13px; color: var(--text-muted); font-weight: 700; display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
.dot.live { animation: pulseLive 2s infinite; }
.dot.offline { background: var(--red); animation: none; }

.header-actions { display: flex; gap: 8px; }
.btn-icon {
  width: 42px; height: 42px; border-radius: 14px; background: var(--accent-light); border: none; 
  display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--accent); cursor: pointer;
  transition: transform 0.2s, background 0.3s;
}
.btn-icon:active { transform: scale(0.9); }
#rf-icon { transition: transform 0.1s ease-out; font-size: 20px; }
.spinning { animation: spin 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseLive { 0% { box-shadow: 0 0 0 0 rgba(255, 121, 0, 0.4); } 70% { box-shadow: 0 0 0 8px rgba(255, 121, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 121, 0, 0); } }
@keyframes slideUpFade { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }

/* ── EFECTO SKELETON ── */
.skeleton {
  background: linear-gradient(90deg, var(--skeleton-1) 25%, var(--skeleton-2) 50%, var(--skeleton-1) 75%);
  background-size: 200% 100%; animation: skeletonLoading 1.5s infinite; border-radius: 12px;
  color: transparent !important; user-select: none; pointer-events: none;
}
.skeleton * { visibility: hidden; }
@keyframes skeletonLoading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

/* ── CONTENIDO ── */
.scroll-area { flex: 1; overflow-y: auto; padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 20px; }
.anim-card { opacity: 0; animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.card-1 { animation-delay: 0.05s; }
.card-2 { animation-delay: 0.15s; }
.card-3 { animation-delay: 0.25s; }

.bento-card { background: var(--surface); border-radius: var(--radius); padding: 24px; box-shadow: 0 10px 30px -5px var(--card-shadow); border: 1px solid var(--card-border); transition: background 0.5s ease, border-color 0.5s ease; }
.card-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--text); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.card-title::before { content: ""; display: block; width: 4px; height: 14px; background: var(--accent); border-radius: 4px; }

/* FONDOS PASTEL SUTILES PARA EL CLIMA */
.bg-clear { background: linear-gradient(135deg, #F0F9FF 0%, #E0F2FE 100%); border-color: #BAE6FD; }
.bg-clouds { background: linear-gradient(135deg, #F8FAFC 0%, #F1F5F9 100%); border-color: #E2E8F0; }
.bg-snow { background: linear-gradient(135deg, #FFFFFF 0%, #F0F9FF 100%); border-color: #E0F2FE; }

/* ── TARJETAS DE RUTAS ── */
.ruta-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.ruta-name { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
.ruta-chip { padding: 8px 16px; border-radius: 100px; font-size: 13px; font-weight: 700; transition: all 0.3s; }
.chip-ok { background: var(--green-light); color: var(--green); }
.chip-warn { background: var(--orange-light); color: var(--orange); }
.chip-danger { background: var(--red-light); color: var(--red); }
.ruta-text { font-size: 15px; line-height: 1.6; color: var(--text-muted); font-weight: 500; }

/* ── CLIMA (REDISEÑO CENTRADO PREMIUM) ── */
.weather-main { 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
  text-align: center; gap: 6px; margin-bottom: 24px; padding-bottom: 24px; 
  border-bottom: 1px solid rgba(11, 27, 63, 0.08); 
}
.w-icon { font-size: 54px; line-height: 1; margin-bottom: 4px; }
.w-temp { font-size: 48px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--text); }
.w-desc { font-size: 14px; color: var(--text-muted); font-weight: 700; margin-top: 4px; }
.w-snow-today { 
  font-size: 14px; font-weight: 800; color: var(--snow); margin-top: 8px; 
  display: inline-block; background: rgba(2, 132, 199, 0.08); 
  padding: 6px 16px; border-radius: 12px;
}
.weather-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
.wg-day { font-size: 14px; font-weight: 800; color: var(--text); }
.wg-icon { font-size: 22px; margin: 6px 0; }
.wg-temps { font-size: 14px; font-weight: 700; color: var(--text-muted); }
.wg-snow { font-size: 13px; font-weight: 800; color: var(--snow); margin-top: 6px; height: 16px; }

/* ── MÁSCARA IFRAME (AJUSTADA A 640px EXACTOS) ── */
.iframe-viewport { 
  width: 100%; border-radius: var(--radius); overflow: hidden; background: var(--surface); 
  box-shadow: 0 10px 30px -5px var(--card-shadow); border: 1px solid var(--card-border); position: relative; 
}
.iframe-viewport::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  border: 10px solid var(--surface); border-radius: var(--radius);
}
.iframe-scaler { width: 400px; height: 640px; position: relative; transform-origin: top left; }
.iframe-scaler iframe { width: 400px; height: 3000px; position: absolute; top: -720px; left: 0; border: none; pointer-events: none; }

/* ── TOAST NOTIFICATIONS ── */
#toast {
  position: fixed; bottom: -80px; left: 50%; transform: translateX(-50%);
  background: #111827; color: #FFFFFF; padding: 14px 24px; border-radius: 100px;
  font-size: 14px; font-weight: 700; transition: bottom 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 2000; white-space: nowrap; pointer-events: none;
}
#toast.show { bottom: 40px; }

/* ── BOTÓN INSTALAR ── */
#install-btn {
  display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: var(--accent); color: #FFF; padding: 16px 32px; border-radius: 100px;
  font-size: 16px; font-weight: 800; box-shadow: 0 10px 25px rgba(255, 121, 0, 0.4); border: none; cursor: pointer; align-items: center; gap: 10px; z-index: 1000;
}
@media (display-mode: standalone) { body { user-select: none; -webkit-user-select: none; } }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-title">
      <div class="title-wrapper">
        <img src="logo.png" alt="Logo" class="main-logo" onerror="this.style.display='none';">
        <h1 class="main-title">Valle de Las Leñas • 2.240 m.s.n.m.</h1>
      </div>
      
      <div class="header-subtitle">
        <div id="status-dot" class="dot live"></div>
        <span id="utime">Conectando...</span>
      </div>
    </div>
    
    <div class="header-actions">
      <button class="btn-icon" onclick="refresh()">
        <span id="rf-icon">↻</span>
      </button>
    </div>
  </header>

  <div class="scroll-area" id="scroll-area">
    
    <div class="bento-card anim-card card-1">
      <div class="card-title">Acceso Principal</div>
      <div class="ruta-header">
        <div class="ruta-name">RP 222</div>
        <div class="ruta-chip chip-warn" id="chip-222">...</div>
      </div>
      <div class="ruta-text skeleton" id="txt-222" style="min-height: 48px;">Cargando información...</div>
    </div>

    <!-- TARJETA DE CLIMA (Con clase base) -->
    <div class="bento-card anim-card card-2" id="wx-card-bento">
      <div class="card-title">Pronóstico de la Montaña</div>
      <div id="wx-container" class="skeleton" style="min-height: 220px; width: 100%;">
        <div style="text-align: center; color: transparent; padding: 20px 0;">Cargando</div>
      </div>
    </div>

    <div class="anim-card card-3">
      <div class="card-title" style="margin-left: 8px;">Estado de Medios (En vivo)</div>
      <div class="iframe-viewport" id="iframe-viewport">
        <div class="iframe-scaler" id="iframe-scaler">
          <iframe id="m-iframe" src="https://laslenas.com/estado-pistas/medios/" scrolling="no"></iframe>
        </div>
      </div>
    </div>

  </div>
</div>

<div id="toast"></div>
<button id="install-btn"><span>📲</span> Instalar App Oficial</button>

<script>
// ── VARIABLES DE TIEMPO INTELIGENTE ──
let lastUpdateDate = null;
let isDataOffline = false;

function updateTimeDisplay() {
  if (!lastUpdateDate) return;
  const dot = document.getElementById('status-dot');
  const timeEl = document.getElementById('utime');

  if (isDataOffline) {
    timeEl.textContent = "Sin conexión (Caché)";
    dot.className = 'dot offline';
    return;
  }

  dot.className = 'dot live';
  const diffMs = new Date() - lastUpdateDate;
  const diffMins = Math.floor(diffMs / 60000);

  let text = "";
  if (diffMins < 1) text = "Actualizado hace un momento";
  else if (diffMins === 1) text = "Actualizado hace 1 minuto";
  else if (diffMins < 60) text = `Actualizado hace ${diffMins} minutos`;
  else {
    const diffHours = Math.floor(diffMins / 60);
    text = diffHours === 1 ? "Actualizado hace 1 hora" : `Actualizado hace ${diffHours} horas`;
  }
  timeEl.textContent = text;
}
setInterval(updateTimeDisplay, 30000);

// ── TOAST NOTIFICATIONS ──
let toastTimeout;
function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3500);
}

// ── AJUSTE DE INTERFAZ ──
function ajustarIframeUniversal() {
  const viewport = document.getElementById('iframe-viewport');
  const scaler = document.getElementById('iframe-scaler');
  if(viewport && scaler) {
    const scale = viewport.clientWidth / 400;
    scaler.style.transform = `scale(${scale})`;
    // REAJUSTADO A 640px EXACTOS
    viewport.style.height = (640 * scale) + 'px'; 
  }
}
window.addEventListener('resize', ajustarIframeUniversal);
setTimeout(ajustarIframeUniversal, 50);

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); }); }
let promptInstalacion; const btnInstalar = document.getElementById('install-btn');
window.addEventListener('beforeinstallprompt', (e) => { 
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  e.preventDefault(); promptInstalacion = e; btnInstalar.style.display = 'flex'; 
});
btnInstalar.addEventListener('click', async () => { btnInstalar.style.display = 'none'; promptInstalacion.prompt(); await promptInstalacion.userChoice; promptInstalacion = null; });

const contentEl = document.getElementById('scroll-area');
const rfIcon = document.getElementById('rf-icon');
let startY = 0, currentY = 0, isPulling = false;
contentEl.addEventListener('touchstart', (e) => { if (contentEl.scrollTop === 0) { startY = e.touches[0].clientY; isPulling = true; rfIcon.style.transition = 'none'; }}, {passive: true});
contentEl.addEventListener('touchmove', (e) => { if (!isPulling) return; currentY = e.touches[0].clientY; const pullDist = currentY - startY; if (pullDist > 0 && contentEl.scrollTop === 0) { if (e.cancelable) e.preventDefault(); rfIcon.style.transform = `rotate(${pullDist * 2}deg)`; }}, {passive: false});
contentEl.addEventListener('touchend', () => { if (!isPulling) return; isPulling = false; if (currentY - startY > 80) { rfIcon.style.transform = ''; refresh(); } else { rfIcon.style.transition = 'transform 0.3s ease-out'; rfIcon.style.transform = `rotate(0deg)`; }});

function refresh() {
  const ic = document.getElementById('rf-icon');
  ic.style.transition = ''; ic.classList.add('spinning');
  
  document.getElementById('txt-222').classList.add('skeleton');
  document.getElementById('wx-container').classList.add('skeleton');
  document.getElementById('wx-card-bento').className = 'bento-card anim-card card-2'; 
  document.getElementById('wx-container').innerHTML = '';

  loadWeather(); 
  loadRouteStatus();
  
  const elIframe = document.getElementById('m-iframe');
  elIframe.src = elIframe.src; 
  
  setTimeout(() => { ic.classList.remove('spinning'); }, 1200);
}

// ── RUTAS CON CACHÉ OFFLINE ──
function renderRuta(data) {
  const chip = document.getElementById('chip-222');
  const txtEl = document.getElementById('txt-222');
  txtEl.classList.remove('skeleton');
  txtEl.textContent = data.rp222.texto;
  if (data.rp222.tipo === 'danger') { chip.className = 'ruta-chip chip-danger'; chip.textContent = 'Cerrada'; } 
  else if (data.rp222.tipo === 'warn') { chip.className = 'ruta-chip chip-warn'; chip.textContent = 'Cadenas / Precaución'; } 
  else { chip.className = 'ruta-chip chip-ok'; chip.textContent = 'Transitable'; }
}

async function loadRouteStatus() {
  try {
    const res = await fetch('./estado.json?t=' + new Date().getTime());
    if (!res.ok) throw new Error();
    const data = await res.json();
    localStorage.setItem('cached_ruta', JSON.stringify(data)); 
    renderRuta(data);
    isDataOffline = false; lastUpdateDate = new Date(); updateTimeDisplay();
  } catch(e) {
    const cached = localStorage.getItem('cached_ruta');
    if (cached) { renderRuta(JSON.parse(cached)); isDataOffline = true; updateTimeDisplay(); showToast("⚠️ Sin internet. Mostrando ruta guardada."); } 
    else { document.getElementById('txt-222').textContent = "No hay datos guardados. Conectate a internet."; }
  }
}

// ── CLIMA SUTIL Y PRO (ESTRUCTURA CENTRADA) ──
function renderClima(data) {
  const container = document.getElementById('wx-container');
  const cardBento = document.getElementById('wx-card-bento');
  const codes = { 0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️', 45:'🌫️', 48:'🌫️', 51:'🌧️', 53:'🌧️', 55:'🌧️', 61:'🌧️', 63:'🌧️', 65:'🌧️', 71:'❄️', 73:'❄️', 75:'❄️', 77:'❄️', 80:'🌦️', 81:'🌦️', 82:'🌧️', 85:'❄️', 86:'❄️', 95:'⛈️', 96:'⛈️', 99:'⛈️' };
  
  const currTemp = Math.round(data.current.temperature_2m);
  const stTemp = Math.round(data.current.apparent_temperature);
  const wind = Math.round(data.current.wind_speed_10m);
  const wCode = data.current.weather_code;
  const currIcon = codes[wCode] || '⛅';
  
  // Fondo sutil según clima
  let themeClass = 'bg-clouds';
  if (wCode === 0 || wCode === 1) themeClass = 'bg-clear';
  if ([71,73,75,77,85,86].includes(wCode)) themeClass = 'bg-snow';
  
  cardBento.className = `bento-card anim-card card-2 ${themeClass}`;
  
  const snowTodayVal = Math.round(data.daily.snowfall_sum[0] || 0);
  const snowTodayHtml = snowTodayVal > 0 ? `<div class="w-snow-today">🌨️ ${snowTodayVal} cm hoy</div>` : '';
  
  let html = `
    <div class="weather-main">
      <div class="w-icon">${currIcon}</div>
      <div class="w-temp">${currTemp}°</div>
      <div class="w-desc">ST ${stTemp}° • 💨 Viento ${wind} km/h</div>
      ${snowTodayHtml}
    </div>
    <div class="weather-grid">`;
  
  const days = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  for(let i=1; i<4; i++) {
    const date = new Date(data.daily.time[i] + 'T12:00:00');
    const min = Math.round(data.daily.temperature_2m_min[i]);
    const max = Math.round(data.daily.temperature_2m_max[i]);
    const snowVal = Math.round(data.daily.snowfall_sum[i] || 0);
    const snowText = snowVal > 0 ? `🌨️ ${snowVal} cm` : ``;
    html += `<div><div class="wg-day">${i===1 ? 'Mañana' : days[date.getDay()]}</div><div class="wg-icon">${codes[data.daily.weather_code[i]] || '⛅'}</div><div class="wg-temps">${min}° / ${max}°</div><div class="wg-snow">${snowText}</div></div>`;
  }
  container.classList.remove('skeleton');
  container.innerHTML = html + `</div>`;
}

async function loadWeather() {
  try {
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=-35.1448&longitude=-70.0813&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,snowfall_sum&timezone=America%2FArgentina%2FMendoza&forecast_days=4');
    if (!res.ok) throw new Error();
    const data = await res.json();
    localStorage.setItem('cached_clima', JSON.stringify(data));
    renderClima(data);
    isDataOffline = false; lastUpdateDate = new Date(); updateTimeDisplay();
  } catch(e) {
    const cached = localStorage.getItem('cached_clima');
    if (cached) renderClima(JSON.parse(cached));
  }
}

// Inicializamos todo
loadWeather(); 
loadRouteStatus();
</script>
</body>
</html>
